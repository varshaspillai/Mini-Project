{% extends "base.html" %}
{% block title %}Login — PathoVision AI{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="auth-card">
    <div class="eyebrow">PATHOLOGIST PORTAL</div>
    <h1>Welcome back</h1>
    <p>Sign in to access your analysis dashboard.</p>
    <form method="post">
      <label>Email</label>
      <input type="email" name="email" required>
      <label>Password</label>
      <input type="password" name="password" required>
      <button class="primary-btn full" type="submit">Sign In</button>
    </form>
    <p class="switch">New to PathoVision? <a href="{{ url_for('register') }}">Create an account</a></p>
  </div>
</div>
{% endblock %}
